name: Create Dated Release

on:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Build extension
      run: npm run build
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT
    
    - name: Get version from package.json
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Create ZIP archive
      run: |
        cd dist
        zip -r ../bandwidth-hero-v${{ steps.version.outputs.version }}-${{ steps.date.outputs.date }}.zip .
        cd ..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ steps.date.outputs.date }}
        name: Release v${{ steps.version.outputs.version }} (${{ steps.date.outputs.date }})
        body: |
          ## Bandwidth Hero Extension
          
          **Version:** ${{ steps.version.outputs.version }}
          **Build Date:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ github.sha }}
          
          ### Installation
          
          1. Download the `bandwidth-hero-v${{ steps.version.outputs.version }}-${{ steps.date.outputs.date }}.zip` file
          2. Unzip the file
          3. Open Chrome and go to `chrome://extensions/`
          4. Enable "Developer mode"
          5. Click "Load unpacked" and select the unzipped folder
          
          ### Changes
          
          This is an automated release built from the latest commit on ${{ github.ref_name }}.
          
          See commit history for detailed changes: ${{ github.event.compare }}
        draft: false
        prerelease: false
        files: |
          bandwidth-hero-v${{ steps.version.outputs.version }}-${{ steps.date.outputs.date }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
